<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Promos de viaje | Lunaris</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
</head>
<body class="bg-light">
<main class="container py-4">
    <a th:href="@{/agenda}" class="btn btn-outline-secondary btn-sm mb-3">Volver a la agenda</a>
    <div class="d-flex justify-content-between align-items-center gap-3 mb-3">
        <h1 class="h3 mb-0">Promos de viaje</h1>
        <a th:href="@{/reservations/new(promo=true)}" class="btn btn-primary">Cargar promo</a>
    </div>
    <p class="alert alert-danger" role="alert" th:if="${errorMessage}" th:text="${errorMessage}"></p>
    <form th:action="@{/reservations/promos}" method="get" class="row g-2 align-items-end mb-4">
        <label class="col-sm-6">Número de promo, pasajero o teléfono
            <input type="search" name="q" th:value="${q}" class="form-control" maxlength="100">
        </label>
        <label class="col-sm-4">Estado
            <select name="status" class="form-select">
                <option value="">Todos</option>
                <option th:each="item : ${statuses}" th:value="${item.name()}"
                        th:text="${item.name()}" th:selected="${status == item}"></option>
            </select>
        </label>
        <div class="col-sm-2"><button class="btn btn-primary" type="submit">Buscar</button></div>
    </form>
    <p th:if="${promos.empty}" class="text-muted">No se encontraron promos.</p>
    <div th:unless="${promos.empty}" class="table-responsive">
        <table class="table align-middle">
            <thead><tr><th>Número</th><th>Pasajero</th><th>Teléfono</th><th>Abonado</th><th>Estado</th><th>Gestión</th></tr></thead>
            <tbody>
            <tr th:each="promo : ${promos.content}">
                <td><a th:href="@{/reservations/promos/{number}(number=${promo.number})}" th:text="${promo.number}"></a></td>
                <td th:text="${promo.passengerName}"></td>
                <td th:text="${promo.phone}"></td>
                <td th:text="|$${#numbers.formatDecimal(promo.paidAmount, 1, 'POINT', 2, 'COMMA')}|"></td>
                <td th:text="${promo.status}"></td>
                <td><a th:if="${promo.status.name() == 'DISPONIBLE'}" class="btn btn-sm btn-outline-primary"
                       th:href="@{/reservations/promos/{number}/redeem(number=${promo.number})}">Canjear</a></td>
            </tr>
            </tbody>
        </table>
    </div>
    <nav class="d-flex gap-2" aria-label="Páginas de promos">
        <a th:if="${promos.hasPrevious()}" class="btn btn-outline-secondary"
           th:href="@{/reservations/promos(q=${q},status=${status},page=${promos.number - 1})}">Anterior</a>
        <a th:if="${promos.hasNext()}" class="btn btn-outline-secondary"
           th:href="@{/reservations/promos(q=${q},status=${status},page=${promos.number + 1})}">Siguiente</a>
    </nav>
</main>
</body>
</html>
