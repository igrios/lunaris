<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <title>Detalle del Día</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body { background-color: #dee2e6; }
    .card { border: none; }
    .card-body { padding: 2rem; }
    h2, h4 { color: #343a40; }
  </style>
</head>

<body class="bg-light">

  <div class="container mt-4">

    <h1 class="text-center mb-4">
      🚐 Viajes del Día
    </h1>
    
    <div class="mb-3 d-flex gap-2">
      <button type="button" class="btn btn-outline-primary flex-fill" onclick="selectAllReservations()">
        ☑ Seleccionar Todos
      </button>
      <button type="button" class="btn btn-outline-secondary flex-fill" onclick="unselectAllReservations()">
        ☐ Deseleccionar Todos
      </button>
    </div>

    <div class="row g-2 mb-3">
        <div class="col-md-6">
            <select id="selectChofer" class="form-select fw-bold border-success" style="height: 100%;">
                <option value="">-- Seleccionar Chofer --</option>
                <option th:each="c : ${choferes}" th:value="${c.phone}" th:text="${c.fullName}"></option>
            </select>
        </div>
        <div class="col-md-6">
            <button type="button" onclick="enviarAChofer()" class="btn btn-success w-100 fw-bold">
                🚖 Enviar a Chofer
            </button>
        </div>
    </div>

    <div class="card shadow mb-3">
      <div class="card-body">
        <h4>
          📅 <span th:text="${date}"></span>
        </h4>
      </div>
    </div>

    <div th:each="reservation : ${reservations}"
         th:id="'reservation-card-' + ${reservation.id}"
         class="card shadow-sm mb-3">

        <div class="card-body">

            <div class="form-check mb-3">
                <input class="form-check-input reservation-checkbox" type="checkbox">
                <label class="form-check-label fw-bold text-secondary">
                    Seleccionar para chofer
                </label>
            </div>

            <div class="reservation-data d-none"
                 th:data-name="${reservation.passenger.firstName + ' ' + reservation.passenger.lastName}"
                 th:data-phone="${reservation.passenger.phone}"
                 th:data-locality="${reservation.pickupLocality}"
                 th:data-destination="${reservation.destination}"
                 th:data-address="${reservation.pickupAddress}"
                 th:data-return="${reservation.returnDate}"
                 th:data-roundtrip="${reservation.roundTrip}"
                 th:data-notes="${reservation.notes}"
                 th:data-passengercount="${reservation.passengerCount != null ? reservation.passengerCount : 1}"
                 th:data-companionnames="${reservation.companionNames}">
            </div>

            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="mb-0">
                    👤 <span th:text="${reservation.passenger.firstName + ' ' + reservation.passenger.lastName}"></span>
                </h5>
                <span th:if="${reservation.roundTrip}" class="badge bg-success">
                    🔄 Ida y Vuelta
                </span>
            </div>

            <p>📍 <strong>Origen:</strong> <span th:text="${reservation.pickupLocality}"></span></p>
            <p>🏁 <strong>Destino:</strong> <span th:text="${reservation.destination}"></span></p>
            <p th:if="${reservation.pickupAddress != null and reservation.pickupAddress != ''}">
                🏠 <strong>Dirección:</strong> <span th:text="${reservation.pickupAddress}"></span>
            </p>
            <p>📞 <strong>Teléfono:</strong> <span th:text="${reservation.passenger.phone}"></span></p>
            
            <p>
                🔢 <strong>Asientos totales:</strong> 
                <span class="badge bg-primary fs-6" th:text="${reservation.passengerCount != null ? reservation.passengerCount : 1}">1</span>
            </p>

            <p th:if="${reservation.companionNames != null and reservation.companionNames != ''}">
                👥 <strong>Acompañantes:</strong> <span class="text-muted" th:text="${reservation.companionNames}"></span>
            </p>

            <p th:if="${reservation.returnDate != null}">🔄 <strong>Regreso:</strong> <span th:text="${reservation.returnDate}"></span></p>
            <p th:if="${reservation.amount != null}">💰 <strong>Importe:</strong> $<span th:text="${reservation.amount}"></span></p>

            <div class="mb-3 status-container">
                <span th:if="${reservation.status == 'PENDING_PAYMENT'}" class="badge bg-warning text-dark">⏳ Pago Pendiente</span>
                <span th:if="${reservation.status == 'PAYMENT_RECEIVED'}" class="badge bg-info">📄 Comprobante Recibido</span>
                <span th:if="${reservation.status == 'CONFIRMED'}" class="badge bg-success">✅ Confirmada</span>
            </div>

            <div class="payment-action-container mb-3">
                <div th:if="${reservation.paymentReceiptUrl != null and reservation.paymentReceiptUrl != ''}">
                    <a th:href="@{/api/agenda/comprobante-descarga/{id}(id=${reservation.id})}"
                       target="_blank"
                       class="btn btn-primary btn-sm me-2">
                        📄 Ver Comprobante
                    </a>

                    <button th:if="${reservation.status != 'CONFIRMED'}"
                            type="button"
                            class="btn bg-success text-white btn-sm"
                            th:attr="onclick=|confirmPayment('${reservation.id}')|">
                        ✔ Verificar Pago
                    </button>
                </div>
            </div>

            <div th:if="${reservation.notes != null and reservation.notes != ''}" class="alert alert-light mb-0">
                <strong>📝 Observaciones:</strong>
                <br>
                <span th:text="${reservation.notes}"></span>
            </div>

        </div>
    </div>

    <a href="/agenda" class="btn btn-secondary w-100 mt-3">
      ← Volver a la Lista
    </a>

  </div>

  <script>
   function selectAllReservations() {
    document.querySelectorAll(".reservation-checkbox").forEach(checkbox => checkbox.checked = true);
   }

   function unselectAllReservations() {
    document.querySelectorAll(".reservation-checkbox").forEach(checkbox => checkbox.checked = false);
   }

   function confirmPayment(reservationId) {
        if (!confirm("¿Desea confirmar el pago de esta reserva?")) {
            return;
        }

        fetch(`/api/agenda/confirmar-pago/${reservationId}`, {
            method: 'POST'
        })
        .then(response => {
            if (!response.ok) throw new Error();

            const card = document.getElementById(`reservation-card-${reservationId}`);
            
            const statusContainer = card.querySelector(".status-container");
            statusContainer.innerHTML = `<span class="badge bg-success">✅ Confirmada</span>`;

            const actionContainer = card.querySelector(".payment-action-container");
            const btnVerificar = actionContainer.querySelector("button");
            if(btnVerificar) btnVerificar.remove();

            alert("Pago verificado correctamente y notificación de WhatsApp enviada.");
        })
        .catch(error => {
            console.error(error);
            alert("No se pudo verificar el pago.");
        });
    }

    function enviarAChofer() {
        const select = document.getElementById("selectChofer");
        const celularChofer = select.value;

        if (!celularChofer) {
            alert("Por favor, selecciona un chofer de la lista antes de enviar.");
            return;
        }

        const checkboxes = document.querySelectorAll('.reservation-checkbox:checked');
        if (checkboxes.length === 0) {
            alert("Por favor, selecciona al menos un pasajero para armar la hoja de ruta.");
            return;
        }

        const reservationIds = [];
        checkboxes.forEach(checkbox => {
            const card = checkbox.closest(".card");
            const id = card.id.replace("reservation-card-", "");
            reservationIds.push(id);
        });

        fetch(`/api/agenda/enviar-hoja-ruta?phone=${celularChofer}`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(reservationIds)
        })
        .then(response => {
            if (!response.ok) throw new Error();
            alert("¡Hoja de ruta enviada al chofer de forma directa y exitosa!");
        })
        .catch(error => {
            console.error(error);
            alert("Hubo un error al intentar enviar el mensaje por la API.");
        });
    }
  </script>

</body>
</html>
