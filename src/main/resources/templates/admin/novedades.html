<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Lunaris - Novedades</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>body { background:#f4f6f9; padding-top:75px; } .card { border:0; border-radius:12px; } .flyer { width:90px; height:90px; object-fit:cover; border-radius:8px; }</style>
</head>
<body>
  <nav th:replace="~{fragments/nav :: bar('novedades')}"></nav>
  <main class="container my-4">
    <h1 class="fw-bold">Novedades y promociones</h1>
    <p class="text-muted">Administrá los flyers visibles en la aplicación.</p>
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div class="card shadow-sm mb-4"><div class="card-body">
      <form th:action="@{/admin/novedades}" method="post" enctype="multipart/form-data" class="row g-3 align-items-end">
        <div class="col-md-4"><label class="form-label" for="title">Título</label><input class="form-control" id="title" name="title" maxlength="150" required></div>
        <div class="col-md-3"><label class="form-label" for="image">Flyer</label><input class="form-control" id="image" name="image" type="file" accept="image/*" required></div>
        <div class="col-md-2"><label class="form-label" for="validUntil">Válido hasta</label><input class="form-control" id="validUntil" name="validUntil" type="date"></div>
        <div class="col-md-1 form-check ms-3 mb-2"><input class="form-check-input" id="active" name="active" type="checkbox" value="true" checked><label class="form-check-label" for="active">Activo</label></div>
        <div class="col-md-2"><button class="btn btn-primary w-100" type="submit">Publicar</button></div>
      </form>
    </div></div>
    <div class="card shadow-sm"><div class="table-responsive"><table class="table table-hover align-middle mb-0">
      <thead class="table-dark"><tr><th>Flyer</th><th>Título</th><th>Estado</th><th>Vigencia</th><th>Creación</th><th>Acciones</th></tr></thead>
      <tbody>
        <tr th:each="banner : ${banners}">
          <td><a th:href="${banner.imageUrl}" target="_blank" rel="noopener"><img class="flyer" th:src="${banner.imageUrl}" th:alt="${banner.title}"></a></td>
          <td class="fw-semibold" th:text="${banner.title}"></td>
          <td><span class="badge" th:classappend="${banner.active} ? 'text-bg-success' : 'text-bg-secondary'" th:text="${banner.active ? 'Activo' : 'Inactivo'}"></span></td>
          <td th:text="${banner.validUntil != null ? #temporals.format(banner.validUntil, 'dd/MM/yyyy') : 'Sin vencimiento'}"></td>
          <td th:text="${#temporals.format(banner.createdAt, 'dd/MM/yyyy HH:mm')}"></td>
          <td><form th:action="@{/admin/novedades/{id}/eliminar(id=${banner.id})}" method="post" onsubmit="return confirm('¿Eliminar esta novedad?');"><button class="btn btn-sm btn-outline-danger" type="submit">Eliminar</button></form></td>
        </tr>
        <tr th:if="${#lists.isEmpty(banners)}"><td colspan="6" class="text-center text-muted py-5">No hay novedades cargadas.</td></tr>
      </tbody>
    </table></div></div>
  </main>
</body>
</html>
