<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ingresar | Lunaris Ansenuza</title>
    <style>
        :root { color-scheme: light; font-family: Inter, system-ui, sans-serif; }
        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            background: #f3f6f9;
            color: #17212b;
        }
        main {
            width: min(90vw, 390px);
            padding: 2rem;
            border-radius: 16px;
            background: white;
            box-shadow: 0 18px 48px rgb(23 33 43 / 12%);
        }
        h1 { margin: 0 0 .4rem; font-size: 1.65rem; }
        p { margin: 0 0 1.5rem; color: #637282; }
        label { display: block; margin-top: 1rem; font-weight: 650; }
        input {
            box-sizing: border-box;
            width: 100%;
            margin-top: .4rem;
            padding: .8rem;
            border: 1px solid #cbd5df;
            border-radius: 8px;
            font: inherit;
        }
        button {
            width: 100%;
            margin-top: 1.4rem;
            padding: .85rem;
            border: 0;
            border-radius: 8px;
            background: #1167b1;
            color: white;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }
        .alert { padding: .75rem; border-radius: 8px; margin-bottom: 1rem; }
        .error { background: #feecec; color: #9e2525; }
        .success { background: #e9f8ef; color: #176b38; }
    </style>
</head>
<body>
<main>
    <h1>Lunaris Ansenuza</h1>
    <p>Acceso al panel de administración</p>

    <div class="alert error" th:if="${param.error}">
        Usuario o contraseña incorrectos.
    </div>
    <div class="alert success" th:if="${param.logout}">
        Sesión cerrada correctamente.
    </div>

    <form method="post" th:action="@{/login}">
        <label for="username">Usuario</label>
        <input id="username" name="username" type="text" autocomplete="username" required autofocus>

        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>

        <button type="submit">Ingresar</button>
    </form>
</main>
</body>
</html>
