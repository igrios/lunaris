<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <title>Lunaris - Gestión de Choferes</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body { background-color: #f4f6f9 !important; padding-top: 75px; }
    .card { border: none; border-radius: 12px; }
    .bg-navbar { background-color: #1e293b !important; }
    .form-card { border-top: 4px solid #0d6efd; }
    .table-hover tbody tr:hover { background-color: #eef4ff; }
  </style>
</head>

<body>

  <nav th:replace="~{fragments/nav :: bar('choferes')}"></nav>

  <div class="container mt-4 mb-5">

    <div class="mb-4">
      <h1 class="fw-bold text-dark mb-1">🚗 Gestión de Choferes</h1>
      <p class="text-muted mb-0">Cargá, editá y controlá el estado de tu flota de conductores.</p>
    </div>

    <!-- FORMULARIO DE ALTA / EDICIÓN -->
    <div class="card shadow-sm form-card mb-4">
      <div class="card-body p-4">
        <h5 class="fw-bold mb-3" id="formTitulo"><i class="bi bi-person-plus-fill me-2 text-primary"></i>Nuevo Chofer</h5>
        <form th:action="@{/choferes/guardar}" method="post" class="row g-3 align-items-end">
          <input type="hidden" name="id" id="chofer-id">

          <div class="col-md-4">
            <label class="form-label fw-semibold">Nombre y Apellido</label>
            <input type="text" name="fullName" id="chofer-nombre" class="form-control" placeholder="Ej: Martín Cuestaz" required>
          </div>

          <div class="col-md-3">
            <label class="form-label fw-semibold">Teléfono (WhatsApp)</label>
            <input type="text" name="phone" id="chofer-telefono" class="form-control" placeholder="Ej: 543564000000" required>
          </div>

          <div class="col-md-2">
            <label class="form-label fw-semibold">Ranking</label>
            <input type="number" name="ranking" id="chofer-ranking" class="form-control" min="1" max="5" placeholder="1-5">
          </div>

          <div class="col-md-1">
            <div class="form-check mt-4 pt-1">
              <input class="form-check-input" type="checkbox" name="active" value="true" id="chofer-activo" checked>
              <label class="form-check-label fw-semibold" for="chofer-activo">Activo</label>
            </div>
          </div>

          <div class="col-md-2 d-grid gap-2">
            <button type="submit" class="btn btn-primary fw-bold" id="btnGuardar">
              <i class="bi bi-save me-1"></i> Guardar
            </button>
            <button type="button" class="btn btn-outline-secondary btn-sm d-none" id="btnCancelar" onclick="cancelarEdicion()">
              Cancelar edición
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- GRILLA DE CHOFERES -->
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
          <h5 class="fw-bold mb-0">Flota registrada
            <span class="badge bg-dark ms-2" th:text="${#lists.size(choferes)}">0</span>
          </h5>
          <div class="input-group" style="max-width: 320px;">
            <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
            <input type="text" id="buscador" class="form-control" placeholder="Buscar por nombre o teléfono..."
              onkeyup="filtrarTabla()">
          </div>
        </div>

        <div class="table-responsive">
          <table class="table table-hover align-middle">
            <thead class="table-dark">
              <tr>
                <th>Chofer</th>
                <th>Teléfono</th>
                <th class="text-center">Ranking</th>
                <th class="text-center">Estado</th>
                <th class="text-center">Acciones</th>
              </tr>
            </thead>
            <tbody id="tablaChoferes">
              <tr th:each="d : ${choferes}">
                <td class="fw-bold" th:text="${d.fullName}">Nombre</td>
                <td>
                  <a th:href="'https://wa.me/' + ${d.phone}" target="_blank"
                    class="text-success text-decoration-none fw-semibold">
                    <i class="bi bi-whatsapp me-1"></i><span th:text="${d.phone}">-</span>
                  </a>
                </td>
                <td class="text-center">
                  <span class="badge bg-warning text-dark" th:if="${d.ranking != null}" th:text="'⭐ ' + ${d.ranking}">⭐</span>
                  <span class="text-muted" th:if="${d.ranking == null}">-</span>
                </td>
                <td class="text-center">
                  <span class="badge bg-success" th:if="${d.active}">Activo</span>
                  <span class="badge bg-secondary" th:unless="${d.active}">Inactivo</span>
                </td>
                <td class="text-center">
                  <div class="btn-group btn-group-sm" role="group">
                    <button type="button" class="btn btn-outline-primary"
                      th:attr="data-id=${d.id}, data-nombre=${d.fullName}, data-telefono=${d.phone}, data-ranking=${d.ranking}, data-activo=${d.active}"
                      onclick="editarChofer(this)">
                      <i class="bi bi-pencil-fill"></i> Editar
                    </button>

                    <form th:action="@{'/choferes/estado/' + ${d.id}}" method="post" class="d-inline">
                      <button type="submit" class="btn btn-outline-dark" th:title="${d.active} ? 'Desactivar' : 'Activar'">
                        <i class="bi" th:classappend="${d.active} ? 'bi-pause-circle' : 'bi-play-circle'"></i>
                        <span th:text="${d.active} ? 'Desactivar' : 'Activar'">Toggle</span>
                      </button>
                    </form>

                    <form th:action="@{'/choferes/eliminar/' + ${d.id}}" method="post" class="d-inline"
                      onsubmit="return confirm('¿Eliminar definitivamente a este chofer? Esta acción no se puede deshacer.');">
                      <button type="submit" class="btn btn-outline-danger">
                        <i class="bi bi-trash-fill"></i>
                      </button>
                    </form>
                  </div>
                </td>
              </tr>
              <tr th:if="${#lists.isEmpty(choferes)}">
                <td colspan="5" class="text-center text-muted py-4">
                  No hay choferes cargados todavía. Agregá el primero con el formulario de arriba. 👆
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // 🔍 Buscador en vivo (filtra filas por nombre o teléfono)
    function filtrarTabla() {
      const filtro = document.getElementById('buscador').value.toLowerCase();
      document.querySelectorAll('#tablaChoferes tr').forEach(function (fila) {
        if (fila.querySelector('td[colspan]')) return; // fila de "sin datos"
        const texto = fila.innerText.toLowerCase();
        fila.style.display = texto.includes(filtro) ? '' : 'none';
      });
    }

    // ✏️ Carga los datos de un chofer en el formulario para editarlo
    function editarChofer(btn) {
      document.getElementById('chofer-id').value = btn.dataset.id || '';
      document.getElementById('chofer-nombre').value = btn.dataset.nombre || '';
      document.getElementById('chofer-telefono').value = btn.dataset.telefono || '';
      document.getElementById('chofer-ranking').value = (btn.dataset.ranking && btn.dataset.ranking !== 'null') ? btn.dataset.ranking : '';
      document.getElementById('chofer-activo').checked = (btn.dataset.activo === 'true');

      document.getElementById('formTitulo').innerHTML = '<i class="bi bi-pencil-square me-2 text-primary"></i>Editando chofer';
      document.getElementById('btnGuardar').innerHTML = '<i class="bi bi-check2-circle me-1"></i> Actualizar';
      document.getElementById('btnCancelar').classList.remove('d-none');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function cancelarEdicion() {
      document.getElementById('chofer-id').value = '';
      document.getElementById('chofer-nombre').value = '';
      document.getElementById('chofer-telefono').value = '';
      document.getElementById('chofer-ranking').value = '';
      document.getElementById('chofer-activo').checked = true;
      document.getElementById('formTitulo').innerHTML = '<i class="bi bi-person-plus-fill me-2 text-primary"></i>Nuevo Chofer';
      document.getElementById('btnGuardar').innerHTML = '<i class="bi bi-save me-1"></i> Guardar';
      document.getElementById('btnCancelar').classList.add('d-none');
    }
  </script>
</body>

</html>
