<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Nueva Reserva</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #dee2e6;
        }
        .card {
            border: none;
            border-radius: 12px;
        }
        .card-body {
            padding: 2rem;
        }
        h2, h4 {
            color: #343a40;
        }
        .btn-agenda {
            background-color: #6f42c1;
            color: white;
        }
        .btn-agenda:hover {
            background-color: #59359a;
            color: white;
        }
    </style>
</head>
<body class="bg-light">

    <div class="container mt-4 mb-5">

        <div class="d-flex justify-content-between align-items-center mb-3">
            <a href="/" class="btn btn-outline-secondary btn-sm">
                🏠 Ir al Inicio del Panel
            </a>
            <a href="/agenda" class="btn btn-agenda btn-sm fw-bold shadow-sm">
                📅 Ir al Calendario Mensual
            </a>
        </div>

        <div class="card shadow">
            <div class="card-body">

                <h2 class="mb-4">
                   📅  Nueva Reserva
                </h2>

                <form th:action="@{/reservations/new}" th:object="${reservation}" method="post">

                    <div class="alert alert-danger" th:if="${#fields.hasAnyErrors()}">
                        Por favor complete todos los campos obligatorios.
                    </div>

                    <h4 class="mb-3">
                        Datos del Pasajero
                    </h4>

                    <div class="mb-3">
                        <label class="form-label">Nombre</label>
                        <input type="text" class="form-control" name="firstName" id="firstName" value="">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Apellido</label>
                        <input type="text" class="form-control" name="lastName" id="lastName" value="">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Teléfono</label>
                        <input type="text" class="form-control" name="phone" id="phone" maxlength="15" inputmode="numeric"
                            oninput="this.value=this.value.replace(/[^0-9]/g,'')" value="">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">DNI / CUIT</label>
                        <input type="text" class="form-control" name="cuil" id="cuil" maxlength="11" inputmode="numeric"
                            oninput="this.value=this.value.replace(/[^0-9]/g,'')" value="">
                    </div>

                    <hr>

                    <h4 class="mt-4 mb-3">
                        Datos del Viaje
                    </h4>

                    <div class="mb-3">
                        <label class="form-label">Fecha del Viaje</label>
                        <input type="date" class="form-control" th:field="*{travelDate}">
                        <div class="text-danger" th:errors="*{travelDate}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Tipo de Viaje</label>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" th:field="*{roundTrip}" value="false" id="soloIda">
                            <label class="form-check-label" for="soloIda">Solo Ida</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" th:field="*{roundTrip}" value="true" id="idaVuelta">
                            <label class="form-check-label" for="idaVuelta">Ida y Vuelta</label>
                        </div>
                    </div>

                    <div class="mb-3" id="returnDateContainer">
                        <label class="form-label">Fecha Regreso</label>
                        <input type="date" class="form-control" th:field="*{returnDate}">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Localidad de Retiro</label>
                        <select class="form-select" th:field="*{pickupLocality}">
                            <option value="">Seleccionar localidad</option>
                            <option th:each="locality : ${localities}" th:value="${locality.name}" th:text="${locality.name}"></option>
                        </select>
                        <div class="text-danger" th:errors="*{pickupLocality}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Dirección de Retiro</label>
                        <input type="text" class="form-control" th:field="*{pickupAddress}">
                        <div class="text-danger" th:errors="*{pickupAddress}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Destino</label>
                        <select class="form-select" th:field="*{destination}">
                            <option value="">Seleccionar destino</option>
                            <option th:each="locality : ${localities}" th:value="${locality.name}" th:text="${locality.name}"></option>
                        </select>
                        <div class="text-danger" th:errors="*{destination}"></div>
                    </div>

                    <hr>

                    <h4 class="mt-4 mb-3">Gestión de Asientos</h4>
                    
                    <div class="mb-3">
                        <label class="form-label">Cantidad Asientos Ocupados totales</label>
                        <input type="number" class="form-control" name="passengerCount" id="passengerCount" min="1" max="4" value="1">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Nombres de los Acompañantes</label>
                        <input type="text" class="form-control" name="companionNames" id="companionNames" placeholder="Ej: Luis Gómez, Ana Pérez" value="">
                    </div>

                    <div class="form-check mb-3 mt-4">
                        <input class="form-check-input" type="checkbox" th:field="*{paymentVerified}">
                        <label class="form-check-label fw-bold">💸 Pago Verificado</label>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Observaciones</label>
                        <textarea class="form-control" rows="3" th:field="*{notes}"></textarea>
                    </div>

                    <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                        <a href="/agenda" class="btn btn-light px-4 border">📅 Agenda</a>
                        <button type="submit" class="btn btn-primary px-5 fw-bold">Guardar Reserva ✅</button>
                    </div>

                </form>
            </div>
        </div>
    </div>

    <script>
        function toggleReturnDate() {
            const idaVuelta = document.getElementById("idaVuelta");
            const container = document.getElementById("returnDateContainer");
            if (idaVuelta && container) {
                container.style.display = idaVuelta.checked ? "block" : "none";
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            toggleReturnDate();
            const soloIdaBtn = document.getElementById("soloIda");
            const idaVueltaBtn = document.getElementById("idaVuelta");
            if (soloIdaBtn) soloIdaBtn.addEventListener("change", toggleReturnDate);
            if (idaVueltaBtn) idaVueltaBtn.addEventListener("change", toggleReturnDate);
        });
    </script>
</body>
</html>
