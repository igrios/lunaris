<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>
  <!--
    Barra de navegación UNIFICADA de Lunaris Ansenuza.
    Se incluye en cada pantalla con:
      <nav th:replace="~{fragments/nav :: bar('clave-activa')}"></nav>
    Claves: dashboard | reservas | agenda | vueltas | pasajeros | tarifas | facturacion | choferes | nueva
  -->
  <nav th:fragment="bar(active)" class="navbar navbar-expand-lg navbar-dark fixed-top shadow-sm"
    style="background-color:#1e293b;">
    <div class="container-fluid px-4">
      <a class="navbar-brand fw-bold text-white" th:href="@{/dashboard}">🌙 Lunaris Ansenuza</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#lunarisNav"
        aria-controls="lunarisNav" aria-expanded="false" aria-label="Menú">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="lunarisNav">
        <ul class="navbar-nav ms-auto gap-1 align-items-lg-center">
          <li class="nav-item"><a class="nav-link" th:classappend="${active == 'dashboard'} ? 'active fw-bold'" th:href="@{/dashboard}">📊 Inicio</a></li>
          <li class="nav-item"><a class="nav-link" th:classappend="${active == 'reservas'} ? 'active fw-bold'" th:href="@{/reservas-panel}">🗃️ Reservas</a></li>
          <li class="nav-item"><a class="nav-link" th:classappend="${active == 'agenda'} ? 'active fw-bold'" th:href="@{/agenda}">📅 Agenda</a></li>
          <li class="nav-item"><a class="nav-link" th:classappend="${active == 'vueltas'} ? 'active fw-bold'" th:href="@{/reservations/vueltas-abiertas}">🔄 Vueltas</a></li>
          <li class="nav-item"><a class="nav-link" th:classappend="${active == 'pasajeros'} ? 'active fw-bold'" th:href="@{/reservations/passengers-panel}">👥 Pasajeros</a></li>
          <li class="nav-item"><a class="nav-link" th:classappend="${active == 'tarifas'} ? 'active fw-bold'" th:href="@{/fares}">💵 Tarifas</a></li>
          <li class="nav-item"><a class="nav-link" th:classappend="${active == 'facturacion'} ? 'active fw-bold'" th:href="@{/facturacion}">🧾 Facturación</a></li>
          <li class="nav-item"><a class="nav-link" th:classappend="${active == 'choferes'} ? 'active fw-bold'" th:href="@{/choferes}">🚗 Choferes</a></li>
          <li class="nav-item"><a class="nav-link text-warning fw-semibold" th:href="@{/admin/bot/monitor}">🎛️ Bot</a></li>
          <li class="nav-item ms-lg-2 mt-2 mt-lg-0">
            <a class="btn btn-primary btn-sm fw-bold w-100" th:href="@{/reservations/new}">➕ Nueva Reserva</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>
</body>

</html>
