<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <title>Lunaris - Panel de Pasajeros</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #dee2e6 !important;
      padding-top: 56px;
    }

    .card {
      border: none;
      border-radius: 12px;
    }

    .bg-navbar {
      background-color: #1e293b !important;
    }
  </style>
</head>

<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-navbar fixed-top shadow">
    <div class="container-fluid px-4">
      <a class="navbar-brand fw-bold text-white" href="/">🌙 Lunaris Ansenuza</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto gap-2">
          <li class="nav-item"><a class="nav-link" href="/dashboard">📊 Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="/agenda">📅 Calendario / Agenda</a></li>
          <li class="nav-item"><a class="nav-link active" href="/passengers-panel">👥 Pasajeros</a></li>
          <li class="nav-item"><a class="nav-link" href="/fares">💵 Tarifas Comerciales</a></li>
          <li class="nav-item"><a class="nav-link" href="/drivers">🚗 Choferes</a></li>
          <li class="nav-item"><a class="nav-link" href="/vehicles">🚐 Vehículos</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container mt-5 mb-5">
    <div class="card shadow mt-4">
      <div class="card-body p-4">

        <div class="d-flex justify-content-between align-items-center mb-4">
          <h2>👥 Gestión de Pasajeros</h2>
          <span class="badge bg-dark p-2 fs-6" th:text="${#lists.size(pasajeros)} + ' Totales'">0 Totales</span>
        </div>

        <div class="table-responsive">
          <table class="table table-hover align-middle">
            <thead class="table-dark">
              <tr>
                <th>Pasajero</th>
                <th>DNI / CUIT</th>
                <th>Teléfono</th>
                <th class="text-center">Acciones</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="p : ${pasajeros}">
                <td class="fw-bold" th:text="${p.firstName} + ' ' + ${p.lastName}">Ignacio Rios</td>
                <td th:text="${p.cuil != null ? p.cuil : '-'}">-</td>
                <td th:text="${p.phone}">-</td>
                <td class="text-center">
                  <a th:href="'https://wa.me/' + ${p.phone}" target="_blank"
                    class="btn btn-success btn-sm px-3 fw-semibold shadow-sm">
                    <i class="bi bi-whatsapp me-2"></i> Abrir Chat
                  </a>
                </td>
              </tr>
              <tr th:if="${#lists.isEmpty(pasajeros)}">
                <td colspan="4" class="text-center text-muted py-4">No hay pasajeros registrados todavía.</td>
              </tr>
            </tbody>
          </table>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
