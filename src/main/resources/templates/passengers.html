<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <title>Lunaris - Panel de Pasajeros</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body { background-color: #f4f6f9 !important; padding-top: 75px; }
    .card { border: none; border-radius: 12px; }
    .bg-navbar { background-color: #1e293b !important; }
    .table-hover tbody tr:hover { background-color: #eef4ff; }
  </style>
</head>

<body>

  <nav th:replace="~{fragments/nav :: bar('pasajeros')}"></nav>

  <div class="container mt-4 mb-5">
    <div class="card shadow mt-4">
      <div class="card-body p-4">

        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
          <h2 class="mb-0">👥 Gestión de Pasajeros</h2>
          <span class="badge bg-dark p-2 fs-6" th:text="${#lists.size(pasajeros)} + ' Totales'">0 Totales</span>
        </div>

        <!-- 🔍 BUSCADOR EN VIVO -->
        <div class="input-group mb-4">
          <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
          <input type="text" id="buscador" class="form-control form-control-lg"
            placeholder="Buscar pasajero por nombre, DNI/CUIT o teléfono..." onkeyup="filtrarPasajeros()">
        </div>

        <div class="table-responsive">
          <table class="table table-hover align-middle">
            <thead class="table-dark">
              <tr>
                <th>Pasajero</th>
                <th>DNI / CUIT</th>
                <th>Teléfono</th>
                <th class="text-center">Acciones</th>
              </tr>
            </thead>
            <tbody id="tablaPasajeros">
              <tr th:each="p : ${pasajeros}">
                <td class="fw-bold" th:text="${p.firstName} + ' ' + ${p.lastName}">Ignacio Rios</td>
                <td th:text="${p.cuil != null ? p.cuil : '-'}">-</td>
                <td th:text="${p.phone}">-</td>
                <td class="text-center">
                  <a th:href="'https://wa.me/' + ${p.phone}" target="_blank"
                    class="btn btn-success btn-sm px-3 fw-semibold shadow-sm">
                    <i class="bi bi-whatsapp me-2"></i> Abrir Chat
                  </a>
                </td>
              </tr>
              <tr th:if="${#lists.isEmpty(pasajeros)}">
                <td colspan="4" class="text-center text-muted py-4">No hay pasajeros registrados todavía.</td>
              </tr>
              <!-- Fila visible solo cuando el buscador no encuentra coincidencias -->
              <tr id="sinResultados" class="d-none">
                <td colspan="4" class="text-center text-muted py-4">
                  🔍 No se encontraron pasajeros que coincidan con la búsqueda.
                </td>
              </tr>
            </tbody>
          </table>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // 🔍 Filtra la grilla por nombre, DNI/CUIT o teléfono en tiempo real
    function filtrarPasajeros() {
      const filtro = document.getElementById('buscador').value.toLowerCase();
      let visibles = 0;
      document.querySelectorAll('#tablaPasajeros tr').forEach(function (fila) {
        if (fila.id === 'sinResultados' || fila.querySelector('td[colspan]')) return;
        const texto = fila.innerText.toLowerCase();
        const coincide = texto.includes(filtro);
        fila.style.display = coincide ? '' : 'none';
        if (coincide) visibles++;
      });
      document.getElementById('sinResultados').classList.toggle('d-none', visibles !== 0);
    }
  </script>
</body>

</html>
