<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Lunaris Ansenuza - Agenda</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #dee2e6; }
        .card { border: none; margin-bottom: 1rem; shadow: 0 .125rem .25rem rgba(0,0,0,.075); }
    </style>
</head>
<body class="bg-light">

    <div class="container mt-4">
        <h1 class="text-center mb-4">🚐 Operación de la Agenda</h1>
        
        <div class="row">
            <div th:each="day : ${agenda}" class="col-md-12">
                <div class="card shadow-sm">
                    <div class="card-body d-flex justify-content-between align-items-center py-3">
                        <div>
                            <h4 class="mb-1 text-capitalize" th:text="${#temporals.format(day.date, 'EEEE dd/MM')}"></h4>
                            <p class="mb-0 text-secondary">
                                👤 Pasajeros: <strong th:text="${day.totalPassengers}">0</strong> | 
                                ⏳ Pendientes: <strong th:text="${day.pendingPayments}">0</strong>
                            </p>
                        </div>
                        <div class="text-end d-flex align-items-center gap-3">
                            <span class="badge bg-success p-2 fs-6">
                                🚐 <span th:text="${day.estimatedVehicles}">0</span> Autos fijos
                            </span>
                         <a th:href="@{/agenda/view-detalle(date=${day.date})}" class="btn btn-primary">
    Ver Detalles →
</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="mt-4">
            <a href="/" class="btn btn-secondary w-100">← Volver al Panel</a>
        </div>
    </div>

</body>
</html>
