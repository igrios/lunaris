<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Lunaris Ansenuza - Agenda</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            background-color: #f4f6f9 !important; 
            padding-top: 75px; 
        }
        .card { 
            border: none; 
            border-radius: 12px;
            margin-bottom: 1rem; 
        }
        .bg-navbar {
            background-color: #1e293b !important; 
        }
        h1, h4 {
            color: #343a40;
        }
        .card-abierta {
            background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
        }
    </style>
</head>
<body class="bg-light">

    <!-- Menú de Navegación Unificado y Reparado -->
    <nav th:replace="~{fragments/nav :: bar('agenda')}"></nav>

    <div class="container mt-4 mb-5">
        <h1 class="text-center mb-4 pt-2 fw-bold">📅 Operación de la Agenda</h1>
        
        <div class="row mb-3">
            <div class="col-md-12">
                <div class="card card-abierta text-white shadow-sm">
                    <div class="card-body d-flex justify-content-between align-items-center py-3">
                        <div>
                            <h5 class="mb-1 fw-bold text-warning">🛑 Pasajes con Vuelta Abierta</h5>
                            <p class="mb-0 text-light opacity-75 small">
                                Reservas pendientes de asignar fecha de regreso definitiva.
                            </p>
                        </div>
                        <div>
                            <a th:href="@{/reservations/vueltas-abiertas}" class="btn btn-outline-warning fw-bold px-4 shadow-sm">
                                Administrar Vueltas Abiertas 🔄
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div th:each="day : ${agenda}" class="col-md-12">
                <div class="card shadow-sm hover-shadow">
                    <div class="card-body d-flex justify-content-between align-items-center py-3">
                        <div>
                            <h4 class="mb-1 text-capitalize fw-bold" th:text="${#temporals.format(day.date, 'EEEE dd/MM')}"></h4>
                            <p class="mb-0 text-secondary fs-6">
                                👤 Pasajeros: <strong class="text-primary" th:text="${day.totalPassengers}">0</strong> | 
                                ⏳ Pendientes de Pago: <strong class="text-danger" th:text="${day.pendingPayments}">0</strong>
                            </p>
                        </div>
                        <div class="text-end d-flex align-items-center gap-3">
                            <span class="badge bg-success p-2 fs-6 shadow-sm">
                                🚐 <span th:text="${day.estimatedVehicles}">0</span> Flota Estimada
                            </span>
                            <a th:href="@{/agenda/view-detalle(date=${day.date})}" class="btn btn-primary px-4 fw-semibold shadow-sm">
                                Ver Detalles →
                            </a>
                            <a th:if="${day.driverId != null}"
                                th:href="@{/hoja-ruta(driverId=${day.driverId},date=${day.date})}"
                                class="btn btn-info px-4 fw-semibold shadow-sm">
                                🗺️ Ver Ruta
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="mt-4 pt-3 border-top">
            <a th:href="@{/dashboard}" class="btn btn-secondary px-4 shadow-sm">← Volver al Panel de Control</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
