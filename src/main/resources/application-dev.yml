app:
  security:
    admin:
      username: ${ADMIN_INITIAL_USERNAME:admin}
      password: ${ADMIN_INITIAL_PASSWORD:admin123}

spring:
  datasource:
    url: jdbc:h2:mem:lunaris_dev;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;NON_KEYWORDS=KEY,VALUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
  flyway:
    enabled: false

whatsapp:
  phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:123456789}
  access-token: ${WHATSAPP_ACCESS_TOKEN:dev-mock-token}
