spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/lunaris_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}

  jpa:
    properties:
      hibernate:
        jdbc:
          time_zone: America/Argentina/Cordoba
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    show-sql: ${SPRING_JPA_SHOW_SQL:true}

  flyway:
    enabled: true
    validate-on-migrate: false # 🛡️ CANCELAMOS LA VALIDACIÓN DE CHECKSUMS PARA PASAR EN LIMPIO

  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB

  jackson:
    time-zone: America/Argentina/Cordoba

  task:
    scheduling:
      time-zone: America/Argentina/Cordoba

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

whatsapp:
  phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID}
  access-token: ${WHATSAPP_ACCESS_TOKEN:}

promotions:
  authorized-operator-phone: ${PROMOTIONS_AUTHORIZED_OPERATOR_PHONE:}

storage:
  local-dir: ${STORAGE_LOCAL_DIR:/tmp/comprobantes/}
  invoices-dir: ${STORAGE_INVOICES_DIR:/tmp/facturas/}
  driver-applications-dir: ${STORAGE_DRIVER_APPLICATIONS_DIR:/tmp/driver-applications/}

server:
  port: ${PORT:8080}

mercadopago:
  access-token: ${MERCADOPAGO_ACCESS_TOKEN:}
  server-base-url: ${SERVER_BASE_URL:http://localhost:${PORT:8080}}
  fee-percentage: ${MERCADOPAGO_FEE_PERCENTAGE:0.06}

management:
  endpoints:
    web:
      exposure:
        include: health

lunaris:
  support-phone: ${LUNARIS_SUPPORT_PHONE:}
  trips:
    capacity: ${LUNARIS_TRIP_CAPACITY:12}
  fleet:
    external-driver-cost: ${LUNARIS_EXTERNAL_DRIVER_COST:0}
  auth:
    otp-ttl: ${LUNARIS_OTP_TTL:PT10M}
    token-ttl: ${LUNARIS_TOKEN_TTL:PT12H}

# ☁️ CONFIGURACIÓN DE CLOUDINARY PARA COMPROBANTES DE LOS VEHÍCULOS
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}
