spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/lunaris_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}

  jpa:
    properties:
      hibernate:
        jdbc:
          time_zone: America/Argentina/Cordoba
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    show-sql: ${SPRING_JPA_SHOW_SQL:true}

  flyway:
    enabled: true
    validate-on-migrate: false # 🛡️ CANCELAMOS LA VALIDACIÓN DE CHECKSUMS PARA PASAR EN LIMPIO

  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB

  jackson:
    time-zone: America/Argentina/Cordoba

  task:
    scheduling:
      time-zone: America/Argentina/Cordoba

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

whatsapp:
  phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID}
  access-token: ${WHATSAPP_ACCESS_TOKEN:}

promotions:
  authorized-operator-phone: ${PROMOTIONS_AUTHORIZED_OPERATOR_PHONE:}

storage:
  local-dir: ${STORAGE_LOCAL_DIR:/tmp/comprobantes/}
  invoices-dir: ${STORAGE_INVOICES_DIR:/tmp/facturas/}

server:
  port: ${PORT:8080}

# ☁️ CONFIGURACIÓN DE CLOUDINARY PARA COMPROBANTES DE LAS COMBIS
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:dgrwrcb5p}
  api-key: ${CLOUDINARY_API_KEY:173558398347922}
  api-secret: ${CLOUDINARY_API_SECRET:ACÁ_PEGÁS_TU_API_SECRET_OCULTO}
