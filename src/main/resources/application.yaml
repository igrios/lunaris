spring:
  datasource:
    # Si encuentra la variable de Render usa esa, si no, se conecta a tu localhost
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/lunaris_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}

  jpa:
    hibernate:
      # En producción es mejor 'update' o 'none' si manejás Flyway, para desarrollo dejamos validate como base
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    show-sql: ${SPRING_JPA_SHOW_SQL:true}

  flyway:
    enabled: true

  servlet:
    multipart:
      # 🧾 Permitir PDFs de factura de buen tamaño
      max-file-size: 15MB
      max-request-size: 15MB

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

whatsapp:
  phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:1220123434507524}
  access-token: ${WHATSAPP_ACCESS_TOKEN:}
storage:
  # Ojo acá: en Render usamos la carpeta temporal del contenedor '/tmp/' para los comprobantes
  local-dir: ${STORAGE_LOCAL_DIR:/tmp/comprobantes/}
  # 🧾 PDFs de facturas que sube la operadora
  invoices-dir: ${STORAGE_INVOICES_DIR:/tmp/facturas/}

server:
  # Render asigna el puerto dinámicamente en la variable PORT, si no existe usa el 8080
  port: ${PORT:8080}